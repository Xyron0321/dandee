<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For Dandee ♡</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#fff0f4,#fce4ed,#fff9f4);font-family:Arial,sans-serif;color:#703c50;text-align:center;overflow-x:hidden}.wrap{position:relative;padding:30px 18px;width:100%;max-width:480px}.small{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#a46b80}.icon{font-size:65px;margin:22px 0}.paper{background:#fffdfb;border:1px solid #f7d6df;box-shadow:0 12px 35px #b85d7e20;border-radius:22px;padding:32px 24px;animation:appear .45s ease}h1{font-family:Georgia,serif;font-size:29px;margin:0 0 18px}p{font-size:15px;line-height:1.9;margin:0 0 26px}button{border:0;border-radius:50px;background:#b85d7e;color:white;padding:14px 25px;font-size:14px;font-weight:bold;cursor:pointer;box-shadow:0 5px 15px #b85d7e35}button:hover{background:#a84d6f}.dots{display:flex;justify-content:center;gap:7px;margin-top:28px}.dot{height:7px;width:7px;border-radius:20px;background:#ebc9d4}.dot.active{width:24px;background:#b85d7e}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.heart{position:fixed;bottom:-40px;color:#e99aaf;opacity:.35;pointer-events:none;animation:float 8s linear infinite}@keyframes float{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<span class="heart" style="left:8%;animation-delay:0s;font-size:26px">♥</span><span class="heart" style="left:80%;animation-delay:2s;font-size:35px">♥</span><span class="heart" style="left:45%;animation-delay:4s;font-size:20px">♥</span>
<main class="wrap"><div class="small">Made with love, just for you</div><div class="icon" id="icon">💌</div><section class="paper" id="paper"><h1 id="title"></h1><p id="message"></p><button id="next"></button></section><div class="dots" id="dots"></div></main>
<script>
const pages=[
['💌','Hi, baby Dandee ♡','I made this little something for you. Nothing fancy, I just wanted to make you smile today.','Open your surprise ♡'],
['🌷','First of all...',"I know there are moments when your mind gets a little too loud. And I know I can't always make every worry disappear. But I want you to know that you don't have to figure everything out alone.",'There’s more →'],
['🤍','Just a reminder, baby',"I'm happy with what we have. I love getting to know you more, choosing you, and being part of your days. I'm not here just for the easy and happy moments.",'One more thing ♡'],
['🫶','Even from far away...',"I may not always be there to hold your hand, but I hope you never have to question how much you mean to me. I'm here because I want to be here, baby. With you.",'A little promise →'],
['💗','My promise to you',"We'll have our worries and misunderstandings sometimes, and that's okay. I want us to keep talking, understanding each other, and choosing to work through things together. You matter to me, sobra.",'Last one, promise ♡'],
['💞','I love you, baby.',"I hope this made you smile kahit konti. I'm really grateful that I have you in my life. And if you ever forget how special you are to me, you can always come back here. Love, Xyron ♡",'Read it again ↺']
];
let step=0;function show(){const p=pages[step];document.getElementById('icon').textContent=p[0];document.getElementById('title').textContent=p[1];document.getElementById('message').textContent=p[2];document.getElementById('next').textContent=p[3];document.getElementById('paper').style.animation='none';void document.getElementById('paper').offsetWidth;document.getElementById('paper').style.animation='appear .45s ease';document.getElementById('dots').innerHTML=pages.map((_,i)=>'<span class="dot '+(i===step?'active':'')+'"></span>').join('')};document.getElementById('next').addEventListener('click',()=>{step=(step+1)%pages.length;show()});show();
</script>
</body></html>
